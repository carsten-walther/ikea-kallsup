# ═══════════════════════════════════════════════════════════
#  Ikea Kallsup - MINIMAL DIAGNOSTIC BUILD
#  MAX98357A + INMP441 + Voice Assistant only
# ═══════════════════════════════════════════════════════════
#
# Everything else (Sendspin, media_source/media_player pipeline, buttons,
# NeoPixel, battery/charging sensors) stripped out to test whether the wake
# word issue is specific to this hardware/ESPHome version, or an
# interaction with the rest of the full config (e.g. the speaker_source
# media_pipeline's mixer/resampler chain). Full config backed up in
# ikea-kallsup_bak.yaml.

substitutions:
  project_name: ikea-kallsup
  friendly_name: Ikea Kallsup

  PIN_I2S_LRCLK: GPIO07
  PIN_I2S_DOUT: GPIO08
  PIN_I2S_BCLK: GPIO09

  PIN_MIC_LRCLK: GPIO01
  PIN_MIC_BCLK: GPIO02
  PIN_MIC_DIN: GPIO05

esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"

  on_boot:
     - priority: -100
       then:
         - wait_until: api.connected
         - delay: 1s
         - voice_assistant.start_continuous:

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

i2s_audio:
  - id: i2s_audio_output
    i2s_lrclk_pin:
      number: ${PIN_I2S_LRCLK}
      allow_other_uses: false
    i2s_bclk_pin:
      number: ${PIN_I2S_BCLK}
      allow_other_uses: false

  - id: i2s_audio_input
    i2s_lrclk_pin:
      number: ${PIN_MIC_LRCLK}
      allow_other_uses: false
    i2s_bclk_pin:
      number: ${PIN_MIC_BCLK}
      allow_other_uses: false

microphone:
  - platform: i2s_audio
    id: inmp441_mic
    i2s_audio_id: i2s_audio_input
    i2s_din_pin: ${PIN_MIC_DIN}
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    use_apll: true

micro_wake_word:
  id: wake_word_id
  microphone:
    microphone: inmp441_mic
  models:
    - model: alexa
  # Own trigger kept for direct proof-of-detection logging, alongside (not
  # instead of) the standard voice_assistant:/use_wake_word: linkage below -
  # the manual-only version left Home Assistant unable to show a wake word
  # picker for this device at all, so reverted back to the standard wiring.
  on_wake_word_detected:
    - logger.log: "LOCAL WAKE WORD DETECTED"

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_audio_output
    i2s_mode: primary
    i2s_dout_pin: ${PIN_I2S_DOUT}
    sample_rate: 48000
    bits_per_sample: 32bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 250ms

voice_assistant:
  id: voice_assistant_id
  microphone: inmp441_mic
  micro_wake_word: wake_word_id
  speaker: i2s_audio_speaker
  use_wake_word: true
